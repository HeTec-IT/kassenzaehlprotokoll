<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kassenzählprotokoll HeTec</title>
<meta name="theme-color" content="#1B2A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#1B2A3D;--ink2:#2E425A;--paper:#EEF1F4;--card:#fff;--line:#D6DDE4;--soft:#F4F6F8;--muted:#5E6C7B;--petrol:#0D5C72;--petrol2:#0A4A5C;--ok:#16794F;--okbg:#E2F2EA;--bad:#C22E2E;--badbg:#FBE5E3;--amber:#8A5A0F;--amberbg:#FBF0DC;--o2:#0B3D91;--tk:#E20074;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.num{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #6CB4C9;outline-offset:2px}
h2{font-size:1.25rem;margin:0 0 12px}
h3{font-size:1.05rem;margin:0}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
.top h1{font-size:1.2rem;margin:0;font-weight:700}
.top .sub{font-size:.85rem;color:#B9C6D4}
.top .grow{flex:1;min-width:0}
.back{background:none;border:1px solid #4A5E77;color:#fff;border-radius:8px;padding:6px 10px}
.tabs{display:flex;gap:2px;max-width:1180px;margin:8px auto 0;overflow-x:auto}
.tab{background:none;border:0;color:#B9C6D4;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tab.on{color:#fff;border-color:#fff}
.brand{height:4px;margin:0 -16px}
.brand.o2{background:var(--o2)}.brand.telekom{background:var(--tk)}.brand.admin{background:var(--petrol)}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.seg{display:inline-flex;background:#E1E6EB;border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(27,42,61,.18)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;font-weight:600;color:var(--ink2);margin-bottom:4px}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:1rem}
.inp.money{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.3rem;font-weight:600;text-align:right}
.inp.req{border-color:var(--bad);background:#FFF8F7}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;gap:0 12px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:700;background:var(--petrol);color:#fff;width:100%}
.btn:hover{background:var(--petrol2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #E7B4B0}
.btn.inline{width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:140px}

/* Zählformular */
.layout{display:grid;gap:16px}
.groups{display:grid;gap:12px}
.groups .card{margin:0}
@media(min-width:700px){.groups{grid-template-columns:1fr 1fr}}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ghead .num{font-weight:700}
.row{display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(78px,auto);align-items:center;gap:8px;padding:5px 0;border-top:1px solid #EDF0F3}
.row:first-of-type{border-top:0}
.row .lab{font-weight:600}
.row .lab small{display:block;color:var(--muted);font-weight:400;font-size:.76rem;line-height:1.1}
.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:40px;border:0;background:var(--soft);font-size:1.2rem;color:var(--ink2)}
.stepper button:active{background:#E1E6EB}
.stepper input{width:58px;height:40px;border:0;text-align:center;font-size:1.05rem;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;background:#fff}
.row .sum{text-align:right;color:#9AA6B2}
.row.has .sum{color:var(--ink);font-weight:600}

.tally{background:var(--ink);color:#fff;padding:14px 16px;border-radius:var(--r)}
.tnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tnums span{display:block;font-size:.75rem;color:#B9C6D4}
.tnums b{font-size:1.2rem;font-weight:600}
.verdict{margin:10px 0;padding:9px 12px;border-radius:8px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink2);transition:background .2s}
.tally.ok .verdict{background:var(--ok)}
.tally.bad .verdict{background:var(--bad)}
.tally .err{background:#fff;color:var(--bad);border-radius:8px;padding:8px 10px;font-size:.88rem;font-weight:600;margin-bottom:10px}
.tally .btn{background:#fff;color:var(--ink)}
.tally .btn:hover{background:#E8EDF2}
.tally .sub2{font-size:.78rem;color:#B9C6D4;margin-top:8px}
@media(min-width:900px){.layout{grid-template-columns:1fr 320px;align-items:start}.tally{position:sticky;top:120px}}
@media(max-width:899px){.tally{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:14px 14px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(27,42,61,.25)}.layout{padding-bottom:200px}.tally .sub2{display:none}}

/* Status */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.none{background:#E8ECF0;color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status{border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);background:#fff}
.status.ok{border-left:6px solid var(--ok)}
.status.bad{border-left:6px solid var(--bad);background:#FFFBFA}
.status .big{font-size:1.45rem;font-weight:700;margin:2px 0 8px}
.status.ok .big{color:var(--ok)}.status.bad .big{color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kv span{display:block;font-size:.75rem;color:var(--muted)}
.kv b{font-size:1.1rem}
.note{background:var(--amberbg);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-top:8px}

/* Verlauf */
.origin{background:var(--badbg);border:1px solid #EFC2BE;color:#7E1E1E;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.origin b{color:var(--bad)}
.tl{list-style:none;margin:0;padding:0}
.tl li{background:#fff;border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;margin-bottom:8px}
.tl li.bad{border-left-color:var(--bad);background:#FFF9F8}
.tl li.start{box-shadow:0 0 0 2px var(--bad) inset}
.tl summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.tl summary::-webkit-details-marker{display:none}
.tl .when{font-weight:700}
.tl .who{font-size:.85rem;color:var(--muted)}
.tl .d{text-align:right;font-weight:700;font-size:1.1rem}
.tl li.bad .d{color:var(--bad)}.tl li:not(.bad) .d{color:var(--ok)}
.tl .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 8px;background:#E8ECF0;color:var(--ink2)}
.tag.red{background:var(--bad);color:#fff}
.tag.green{background:var(--okbg);color:var(--ok)}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tl .body{padding:0 12px 12px;font-size:.9rem}
.tl .body table{width:100%;border-collapse:collapse}
.tl .body td{padding:3px 0;border-top:1px solid #EDF0F3}
.tl .body td:last-child{text-align:right}
.tl .rem{grid-column:1/-1;font-size:.88rem;color:var(--amber)}

/* Übersicht */
.sgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.scard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.scard:hover{border-color:#A9B6C3}
.scard.bad{border-color:#E7B4B0;background:#FFFBFA}
.scard h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.o2{background:var(--o2)}.dot.telekom{background:var(--tk)}
.kline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #EDF0F3;flex-wrap:wrap}
.chips{display:flex;gap:4px}
.chip{font-size:.72rem;font-weight:700;border-radius:5px;padding:2px 6px;background:#E8ECF0;color:#8794A1}
.chip.on{background:var(--okbg);color:var(--ok)}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.summary div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;flex:1;min-width:140px}
.summary b{font-size:1.5rem;display:block}
.summary .bad b{color:var(--bad)}.summary .ok b{color:var(--ok)}

/* Start */
.picker{max-width:560px;margin:0 auto;padding:24px 16px}
.picker h1{font-size:1.6rem;margin:8px 0 4px}
.plist{display:grid;gap:8px;margin:18px 0}
.plist a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--ink);font-weight:600}
.plist a:hover{border-color:#A9B6C3}
.plist a small{margin-left:auto;color:var(--muted);font-weight:400}
.linkrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #EDF0F3}
.linkrow code{flex:1;font-size:.8rem;word-break:break-all;color:var(--ink2)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.pin{max-width:340px;margin:60px auto;padding:0 16px;text-align:center}
.pin .inp{text-align:center;font-size:1.6rem;letter-spacing:.4em}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fotos .th{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.fotos .th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.fotos .th button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(27,42,61,.8);color:#fff;font-size:.8rem;line-height:1}
.fsum{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;list-style:none}
.fsum::-webkit-details-marker{display:none}
.lightbox{position:fixed;inset:0;background:rgba(10,18,28,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.login{max-width:380px;margin:40px auto;padding:0 16px}
.login .card{padding:20px}
.login h1{font-size:1.5rem;margin:0 0 4px}
.errbox{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 10px;font-weight:600;font-size:.9rem;margin-bottom:10px}
.foot{text-align:center;color:#8794A1;font-size:.78rem;padding:20px 0 30px}
.foot button{background:none;border:0;color:var(--petrol);font-weight:600;text-decoration:underline}
.center{text-align:center;padding:40px 16px;color:var(--muted)}

</style>
</head>
<body>
<div id="root"><div style="text-align:center;padding:40px;color:#5E6C7B;font-family:system-ui">Lade …</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ================= KONFIGURATION ================= */
const APP_VERSION = '1.0';
const CONFIG = {
  MAIL_TO: 'd.dasilva@hetec-gmbh.de',
  MAIL_CC: '',                                   // z.B. 'b.sacher@hetec-gmbh.de, s.hitzler@hetec-gmbh.de'
  ADMIN_EMAILS: ['d.dasilva@hetec-gmbh.de'],     // muss mit firestore.rules übereinstimmen
  SHOP_DOMAIN: 'kassen.hetec-gmbh.de',           // Shop-Login = <shop-id>@kassen.hetec-gmbh.de
  FRUEH_BIS_STUNDE: 14,
  FOTO_TAGE: 30,
  FOTO_MAX: 6
};
const firebaseConfig = {
  apiKey: "AIzaSyAbqk60gjtsumJIIjH9syoKxS9PlpQFnR4",
  authDomain: "kassen-ae180.firebaseapp.com",
  projectId: "kassen-ae180",
  storageBucket: "kassen-ae180.firebasestorage.app",
  messagingSenderId: "599150345362",
  appId: "1:599150345362:web:9fcc6113b3c9b0d2fe7a4b"
};
const SHOPS = [
  { id:'o2-aalen',               name:'o2 Aalen',               brand:'o2',      kassen:['Kasse 1','Kasse 2'] },
  { id:'o2-sindelfingen',        name:'o2 Sindelfingen',        brand:'o2',      kassen:['Kasse 1','Kasse 2'] },
  { id:'o2-crailsheim',          name:'o2 Crailsheim',          brand:'o2',      kassen:['Kasse 1'] },
  { id:'o2-schwaebisch-hall',    name:'o2 Schwäbisch Hall',     brand:'o2',      kassen:['Kasse 1'] },
  { id:'o2-stuttgart-vaihingen', name:'o2 Stuttgart Vaihingen', brand:'o2',      kassen:['Kasse 1'] },
  { id:'telekom-crailsheim',     name:'Telekom Crailsheim',     brand:'telekom', kassen:['Kasse 1'] }
];
/* ================================================= */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs:true }).catch(() => {});
const TS = firebase.firestore.Timestamp;
const colP = shopId => db.collection('shops').doc(shopId).collection('protokolle');
const colF = shopId => db.collection('shops').doc(shopId).collection('fotos');

const NOTES = [200,100,50,20,10,5];
const COINS = [2,1,0.5,0.2,0.1,0.05,0.02,0.01];
const ROLLS = [{v:2,n:25},{v:1,n:25},{v:0.5,n:40},{v:0.2,n:40},{v:0.1,n:40},{v:0.05,n:50},{v:0.02,n:50},{v:0.01,n:50}];
const VOUCHERS = [15,20,30];

const fmt = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const isOk = d => Math.abs(d) < 0.005;
const eur = x => fmt.format(x || 0);
const eurS = x => (x > 0.004 ? '+' : '') + fmt.format(x || 0);
const coinLbl = v => v >= 1 ? `${v} €` : `${Math.round(v*100)} ct`;
const toIn = n => (n || n === 0) ? Number(n).toFixed(2).replace('.', ',') : '';
const parseEuro = s => {
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/\s|€/g,'');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
};
const parseCount = s => Math.max(0, (String(s ?? '').match(/[+-]?\d+/g) || []).reduce((a,x) => a + parseInt(x,10), 0));
const dt = t => new Date(t).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dFull = t => new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dDay = t => new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const sameDay = (a,b) => new Date(a).toDateString() === new Date(b).toDateString();
const baseUrl = () => location.href.split('#')[0].split('?')[0];
const shopById = id => SHOPS.find(s => s.id === id);
const kasseLbl = (shop,k) => shop.kassen.length > 1 ? ` ${k}` : '';
const shopEmail = id => `${id}@${CONFIG.SHOP_DOMAIN}`;
function roleOf(user){
  if (!user || !user.email) return null;
  const e = user.email.toLowerCase();
  if (CONFIG.ADMIN_EMAILS.map(x => x.toLowerCase()).includes(e)) return { admin:true };
  const s = SHOPS.find(x => shopEmail(x.id) === e);
  return s ? { shop:s } : { unknown:true };
}
function readRoute(){
  const h = new URLSearchParams(location.hash.replace(/^#/,''));
  const q = new URLSearchParams(location.search);
  return { shop:(h.get('shop') || q.get('shop') || '').toLowerCase(), open:h.get('open') || '' };
}
const ls = {
  get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const GROUPS = [
  { key:'n', title:'Scheine',    items: NOTES.map(v => ({ label:`${v} €`, unit:v })) },
  { key:'c', title:'Münzen',     items: COINS.map(v => ({ label:coinLbl(v), unit:v })) },
  { key:'r', title:'Münzrollen', items: ROLLS.map(r => ({ label:coinLbl(r.v), hint:`Rolle ${r.n} St. = ${eur(r.v*r.n)}`, unit:r2(r.v*r.n) })) },
  { key:'v', title:'Voucher',    items: VOUCHERS.map(v => ({ label:`${v} €`, hint:'Voucher', unit:v })) }
];
const emptyCounts = () => Object.fromEntries(GROUPS.map(g => [g.key, g.items.map(() => '')]));
const countsToStr = c => Object.fromEntries(GROUPS.map(g => [g.key, g.items.map((_,i) => { const n = parseCount((c && c[g.key] || [])[i]); return n ? String(n) : ''; })]));
const countsToNum = c => Object.fromEntries(GROUPS.map(g => [g.key, g.items.map((_,i) => parseCount((c && c[g.key] || [])[i]))]));
function totals(counts){
  const t = {}; let ist = 0;
  GROUPS.forEach(g => {
    let c = 0;
    g.items.forEach((it,i) => { c += Math.round(it.unit*100) * parseCount((counts[g.key] || [])[i]); });
    t[g.key] = c/100; ist += c;
  });
  t.ist = ist/100; return t;
}
function makeProtocol(x){
  const counts = countsToNum(x.counts);
  const ist = totals(counts).ist;
  const soll = r2(parseEuro(x.soll)), open = r2(parseEuro(x.open));
  return { id:`${x.kasse.replace(/\s+/g,'')}_${x.t}`, shop:x.shop, kasse:x.kasse, t:x.t, schicht:x.schicht,
    soll, open, counts, ist, diff:r2(ist - soll + open), bemerkung:x.bemerkung || '', name:x.name || '',
    source:x.source || 'shop', fotos:x.fotos || 0, by:(auth.currentUser && auth.currentUser.email) || '' };
}

/* ---------- Firestore ---------- */
function saveProtocol(p, fotos){
  const { id, ...data } = p;
  const ops = [colP(p.shop).doc(id).set({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() })];
  (fotos || []).forEach((f,i) => ops.push(colF(p.shop).doc(`${id}_${i}`).set({
    protokollId:id, kasse:p.kasse, t:p.t, data:f, expireAt: TS.fromMillis(p.t + CONFIG.FOTO_TAGE*864e5) })));
  return Promise.all(ops); // offline: wird gepuffert und später übertragen
}
function useProtocols(shopIds){
  const [state, setState] = useState({ list:[], loading:true, error:'' });
  const key = shopIds.join(',');
  useEffect(() => {
    const parts = {}; const got = new Set();
    const emit = () => setState({ list:Object.values(parts).flat().sort((a,b) => a.t - b.t), loading:got.size < shopIds.length, error:'' });
    const unsubs = shopIds.map(id => colP(id).orderBy('t','desc').limit(400).onSnapshot({ includeMetadataChanges:true },
      snap => {
        parts[id] = snap.docs.map(d => ({ ...d.data(), id:d.id, _pending:d.metadata.hasPendingWrites }));
        got.add(id); emit();
      },
      err => setState(s => ({ ...s, loading:false, error: err.code === 'permission-denied' ? 'Keine Berechtigung – Firestore-Regeln prüfen.' : err.message }))
    ));
    return () => unsubs.forEach(u => u());
  }, [key]);
  return state;
}
async function cleanupFotos(){
  const now = TS.now();
  for (const s of SHOPS) {
    try {
      const snap = await colF(s.id).where('expireAt','<',now).limit(200).get();
      await Promise.all(snap.docs.map(d => d.ref.delete()));
    } catch(e){}
  }
}

function buildMail(p){
  const shop = shopById(p.shop);
  const ok = isOk(p.diff);
  const subject = ok
    ? `Kassenprotokoll ${shop.name}${kasseLbl(shop,p.kasse)} – ${p.schicht} ${dDay(p.t)} – Kasse OK`
    : `ACHTUNG: Kasse ${shop.name}${kasseLbl(shop,p.kasse)} passt nicht – Soll zu Ist ${eurS(p.diff)}`;
  const L = [];
  if (!ok) L.push('!!! ACHTUNG: KASSE PASST NICHT – SOLL ZU IST !!!', '');
  L.push(`Kassenzählprotokoll ${shop.name} – ${p.kasse}`, `${p.schicht} · ${dFull(p.t)}`, `Gezählt von: ${p.name}`, '');
  L.push(`Soll:      ${eur(p.soll)}`, `Ist:       ${eur(p.ist)}`);
  if (p.open) L.push(`Bekannter Fehlbetrag: ${eur(p.open)}`);
  L.push(`Differenz: ${eurS(p.diff)}  ${ok ? '✔ Kasse OK' : '✖ Kasse NICHT OK'}`);
  if (p.bemerkung) L.push('', `Bemerkung: ${p.bemerkung}`);
  if (p.fotos) L.push('', `Fotos: ${p.fotos} (in der App, ${CONFIG.FOTO_TAGE} Tage gespeichert)`);

  GROUPS.forEach(g => {
    const rows = g.items.map((it,i) => ({ it, n:p.counts[g.key][i] })).filter(x => x.n > 0);
    if (!rows.length) return;

}
function copyText(t, done){
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done && done(); } catch(e){} a.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => done && done(), fb); else fb();

function shrink(file, max = 640, q = 0.6){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- Verlauf-Analyse ---------- */
function analyse(list){
  const rows = list.map((p,i) => {
    const prev = list[i-1];
    const delta = prev ? r2(p.diff - prev.diff) : p.diff;
    let tag = null;
    if (!prev) { if (!isOk(p.diff)) tag = 'start'; }
    else if (isOk(prev.diff) && !isOk(p.diff)) tag = 'start';
    else if (!isOk(prev.diff) && isOk(p.diff)) tag = 'fixed';
    else if (!isOk(delta)) tag = 'change';
    return { p, delta, tag };
  });
  let origin = null, lastOk = null;
  const n = list.length - 1;
  if (n >= 0 && !isOk(list[n].diff)) {
    let i = n; while (i > 0 && !isOk(list[i-1].diff)) i--;
    origin = list[i]; lastOk = i > 0 ? list[i-1] : null;
  }
  return { rows, origin, lastOk };
}

        ) : (
          <>
            {loading ? <div className="status"><p className="muted">Lade letzte Zählung …</p></div> : last && <StatusCard p={last} title={kasse} />}
            <CountForm key={kasse + formKey} shop={shop} kasse={kasse} mode="shop" onSave={p => { setSent(p); window.scrollTo(0,0); }} />
          </>
        ))}
        {tab === 'hist' && (loading ? <div className="center">Lade Verlauf …</div> : <History list={mine} />)}
        <Foot />
      </main>
    </>
  );
}

/* ---------- Regionalleitung ---------- */
function Overview({ list, onOpen }){
  const now = Date.now(); const stats = { ok:0, bad:0, none:0 };
  SHOPS.forEach(s => s.kassen.forEach(k => { const l = forKasse(list, s.id, k).pop(); if (!l) stats.none++; else if (isOk(l.diff)) stats.ok++; else stats.bad++; }));
  return (
    <>
      <div className="summary num">
        <div className="bad"><b>{stats.bad}</b>Kasse nicht OK</div>
        <div className="ok"><b>{stats.ok}</b>Kasse OK</div>
        <div><b>{stats.none}</b>ohne Zählung</div>
      </div>
      <div className="sgrid">
        {SHOPS.map(s => {
          const lasts = s.kassen.map(k => forKasse(list, s.id, k).pop());
          const anyBad = lasts.some(l => l && !isOk(l.diff));
          return (
            <button key={s.id} className={'scard' + (anyBad ? ' bad' : '')} onClick={() => onOpen(s.id)}>
              <h3><span className={'dot ' + s.brand}></span>{s.name}</h3>
              {s.kassen.map((k,i) => {
                const today = list.filter(p => p.shop === s.id && p.kasse === k && sameDay(p.t, now));
                const l = lasts[i];
                return (
                  <div className="kline" key={k}>
                    <span style={{fontWeight:600}}>{s.kassen.length > 1 && <Mark k={k} />}{k}</span>
                    <Pill p={l} />
                    <span className="chips">
                      <span className={'chip' + (today.some(p => p.schicht === 'Früh') ? ' on' : '')}>Früh</span>
                      <span className={'chip' + (today.some(p => p.schicht === 'Abend') ? ' on' : '')}>Abend</span>
                    </span>
                    {l && <span className="muted small" style={{width:'100%'}}>{l.schicht} {dt(l.t)} · {l.name}</span>}
                  </div>
                );
              })}
            </button>
          );
        })}
      </div>
    </>
  );
}
function Visit({ shop, list, toast }){
  const [kasse, setKasse] = useState(shop.kassen[0]);
  const [form, setForm] = useState(null);
  const mine = forKasse(list, shop.id, kasse);
  const last = mine[mine.length - 1];
  if (form) return (
    <>
      <h2>{shop.name} – {kasse}: {form.empty ? 'Neu zählen' : 'Ist übernehmen'}</h2>
      <CountForm key={kasse + (form.empty ? 'n' : 'p')} shop={shop} kasse={kasse} mode="visit" prefill={last} takeover={!form.empty}
        onCancel={() => setForm(null)}
        onSave={p => { setForm(null); toast(isOk(p.diff) ? 'Gespeichert – Kasse OK' : 'Gespeichert – Kasse nicht OK'); window.scrollTo(0,0); }} />
    </>
  );
  return (
    <>
      {shop.kassen.length > 1 && <Seg options={shop.kassen} value={kasse} onChange={setKasse} />}
      <StatusCard p={last} title={kasse} />
      <div className="btns" style={{marginBottom:16}}>
        <button className="btn" disabled={!last} style={!last ? {opacity:.5} : null} onClick={() => setForm({ empty:false })}>Ist übernehmen</button>
        <button className="btn ghost" onClick={() => setForm({ empty:true })}>Neu zählen</button>
      </div>
      <h2>Verlauf</h2>
      <History list={mine} />
    </>
  );
}
function LinksTab({ toast }){
  return (
    <div className="card">
      <h2>Shop-Links</h2>
      <p className="muted small">Jeder Shop meldet sich einmal mit seinem Passwort an und sieht nur seine eigenen Daten. Danach „Zum Home-Bildschirm“.</p>
      {SHOPS.map(s => { const u = `${baseUrl()}#shop=${s.id}`; return (
        <div className="linkrow" key={s.id}><span className={'dot ' + s.brand}></span>
          <span style={{flex:1}}><b>{s.name}</b><br/><span className="muted small">Login: {shopEmail(s.id)}</span></span>
          <button className="btn ghost inline" onClick={() => copyText(u, () => toast('Link kopiert'))}>Link kopieren</button></div>); })}
    </div>
  );
}
function AdminApp({ openShop }){
  const { list, loading, error } = useProtocols(SHOPS.map(s => s.id));
  const [tab, setTab] = useState('shops');
  const [shopId, setShopId] = useState(openShop && shopById(openShop) ? openShop : null);
  const [msg, setMsg] = useState('');
  useEffect(() => { cleanupFotos(); }, []);
  useEffect(() => { if (openShop && shopById(openShop)) { setShopId(openShop); history.replaceState(null,'','#shop=admin'); } }, [openShop]);
  const shop = shopId && shopById(shopId);
  return (
    <>
      <Toast msg={msg} onDone={() => setMsg('')} />
      <header className="top">
        <div className="top-row">
          {shop && <button className="back" onClick={() => setShopId(null)} aria-label="Zurück">‹ Shops</button>}
          <div className="grow"><h1>{shop ? shop.name : 'Kassenübersicht'}</h1><div className="sub">{shop ? 'Shopbesuch' : 'Regionalleitung'}</div></div>
        </div>
        {!shop && <nav className="tabs">
          {[['shops','Shops'],['links','Shop-Links']].map(([k,l]) =>
            <button key={k} className={'tab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}>{l}</button>)}
        </nav>}
        <div className={'brand ' + (shop ? shop.brand : 'admin')} style={{marginTop: shop ? 12 : 0}}></div>
      </header>
      <main className="wrap">
        {error && <div className="errbox">{error}</div>}
        {loading && !list.length ? <div className="center">Lade Daten …</div> :
          shop ? <Visit key={shop.id} shop={shop} list={list} toast={setMsg} /> :
          tab === 'shops' ? <Overview list={list} onOpen={id => { setShopId(id); window.scrollTo(0,0); }} /> :
          <LinksTab toast={setMsg} />}
        <Foot />
      </main>
    </>
  );
}

/* ---------- Login / Start ---------- */
function Login({ target, current }){
  const shop = target && target !== 'admin' ? shopById(target) : null;
  const isAdmin = target === 'admin';
  const [email, setEmail] = useState(CONFIG.ADMIN_EMAILS[0] || '');
  const [pw, setPw] = useState(''); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  async function go(e){
    e && e.preventDefault(); setErr(''); setBusy(true);
    try {
      if (current) await auth.signOut();
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await auth.signInWithEmailAndPassword(isAdmin ? email.trim() : shopEmail(shop.id), pw);
    } catch(x){
      setErr(['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials','auth/user-not-found'].includes(x.code) ? 'Passwort falsch.' :
             x.code === 'auth/network-request-failed' ? 'Keine Internetverbindung.' :
             x.code === 'auth/too-many-requests' ? 'Zu viele Versuche – kurz warten.' : x.message);
    }
    setBusy(false);
  }
  return (
    <div className="login">
      <div className={'brand ' + (shop ? shop.brand : 'admin')} style={{margin:'0 0 16px',borderRadius:4}}></div>
      <h1>{shop ? shop.name : 'Regionalleitung'}</h1>
      <p className="muted">Kassenzählprotokoll – Anmeldung</p>
      {current && <p className="note">Aktuell angemeldet als {current}. Mit Anmelden wird gewechselt.</p>}
      <form className="card" onSubmit={go}>
        {err && <div className="errbox">{err}</div>}
        {isAdmin && <label className="field"><span>E-Mail</span><input className="inp" type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" /></label>}
        {!isAdmin && <input type="hidden" autoComplete="username" value={shopEmail(shop.id)} readOnly />}
        <label className="field"><span>Passwort</span><input className="inp" type="password" value={pw} onChange={e => setPw(e.target.value)} autoComplete="current-password" autoFocus /></label>
        <button className="btn" disabled={busy || !pw}>{busy ? 'Anmelden …' : 'Anmelden'}</button>
      </form>
      <p className="small"><a href="#shop=start" style={{color:'var(--petrol)'}}>Anderen Shop wählen</a></p>
    </div>
  );
}
function Picker(){
  return (
    <div className="picker">
      <h1>Kassenzählprotokoll</h1>
      <p className="muted">Shop auswählen und anmelden.</p>
      <div className="plist">
        {SHOPS.map(s => <a key={s.id} href={`#shop=${s.id}`}><span className={'dot ' + s.brand}></span>{s.name}<small>{s.kassen.length > 1 ? `${s.kassen.length} Kassen` : ''}</small></a>)}
      </div>
      <p className="small"><a href="#shop=admin" style={{color:'var(--petrol)'}}>Regionalleitung</a></p>
    </div>
  );
}
function App(){
  const [user, setUser] = useState(undefined);
  const [route, setRoute] = useState(readRoute);
  useEffect(() => auth.onAuthStateChanged(u => setUser(u || null)), []);
  useEffect(() => { const f = () => { setRoute(readRoute()); window.scrollTo(0,0); }; addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  useEffect(() => { if (route.shop && route.shop !== 'start') ls.set('kzp_route', route.shop); }, [route.shop]);

  if (user === undefined) return <div className="center">Lade …</div>;
  if (route.shop === 'start') return <Picker />;
  const role = roleOf(user);
  const target = route.shop || ls.get('kzp_route', '');
  const label = role && (role.admin ? 'Regionalleitung' : role.shop ? role.shop.name : user.email);

  if (role && role.admin && (target === 'admin' || !target)) return <AdminApp openShop={route.open} />;
  if (role && role.shop && (target === role.shop.id || !target)) return <ShopApp key={role.shop.id} shop={role.shop} />;
  if (!target || (target !== 'admin' && !shopById(target))) return <Picker />;
  return <Login target={target} current={user ? label : null} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
</body>
</html>
